[package]
name = "burrow-mobile"
description = "Burrow on Android: a client of burrowd over SSH"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "burrow_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
burrow-api = { git = "https://github.com/Edward-Pratt/burrow", rev = "e63ec4faf7e7c1d08038d7c3573447833b6272a1" }
burrow-link = { path = "../crates/burrow-link" }
data-encoding = "2.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.7", features = [] }

# The system's fingerprint or PIN prompt, which shells wait for. Called
# from Rust only: the page gets no permission for it.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "=2.5.0"
