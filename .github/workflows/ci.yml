name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Before building: a file over the line cap needs splitting. The base
      # is fetched on its own, since the checkout is shallow.
      - name: File length
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin "$BASE"
            .github/check-file-length "$BASE"
          fi

      # The desktop build of the Tauri crate links WebKitGTK; it is only
      # built here so clippy and the tests see the whole workspace. openssh
      # is the sshd the link tests start.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev openssh-server
          # sshd refuses to start without its privilege-separation folder,
          # which only the service unit creates.
          sudo mkdir -p /run/sshd

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # tauri::generate_context! reads the built page, so the frontend is
      # built before any Rust that includes the Tauri crate.
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm check
          pnpm build

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

      # ring needs a C compiler for the target, which the runner's NDK has.
      - name: burrow-link for Android
        run: |
          bin=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$bin/llvm-ar
          cargo check -p burrow-link --target aarch64-linux-android
