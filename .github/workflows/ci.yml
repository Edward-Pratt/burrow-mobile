name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Debug info made up most of the build, and slows linking the tests.
  CARGO_PROFILE_DEV_DEBUG: "0"

# Lint and test build mostly different artifacts, so they run side by side
# rather than one after the other, each with its own cache. The Android
# check needs neither WebKitGTK nor the frontend, so it skips both.
jobs:
  lint:
    runs-on: ubuntu-latest
    # A stuck mirror once held the package step for many minutes; fail
    # instead of waiting out GitHub's six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Before building: a file over the line cap needs splitting. The base
      # is fetched on its own, since the checkout is shallow.
      - name: File length
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            git fetch --depth=1 origin "$BASE"
            .github/check-file-length "$BASE"
          fi

      - uses: ./.github/actions/setup
        with:
          cache-key: lint

      # tauri::generate_context! reads the built page, so the frontend is
      # built before any Rust that includes the Tauri crate.
      - name: Frontend
        run: |
          pnpm check
          pnpm build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
        with:
          cache-key: test
      - name: Frontend
        run: pnpm build
      - name: Test
        run: cargo test --workspace

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Rust
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
          cache-on-failure: true
      # ring needs a C compiler for the target, which the runner's NDK has.
      - name: burrow-link for Android
        run: |
          bin=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang
          export AR_aarch64_linux_android=$bin/llvm-ar
          cargo check -p burrow-link --target aarch64-linux-android
